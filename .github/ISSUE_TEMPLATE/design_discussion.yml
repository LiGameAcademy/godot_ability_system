name: 讨论设计或重构方向
description: 现有行为或职责边界需要重新考虑时，先把问题和取舍摆出来。
body:
  - type: markdown
    attributes:
      value: |
        这里适合讨论执行方式、状态归属、事件边界和兼容性。
        先举一个实际例子，再讨论怎么调整；不需要一开始就确定架构。
  - type: textarea
    id: problem
    attributes:
      label: 哪个场景让你觉得需要调整？
      description: 说明当前实现、遇到的困难和影响。有代码位置或相关 Issue 的话也可以附上。
      placeholder: 动态 Sequence 每帧重新执行前面的节点，扣费节点放在等待节点之前时会重复扣费。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 调整后希望得到什么？
      description: 描述想保留的能力、想解决的问题，以及本次希望处理的范围。
      placeholder: 保留动态条件判断，但让普通技能更容易避免重复扣费；这次先明确节点语义和配置提示。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 有哪些方向可以考虑？（可选）
      description: 写方案、好处和代价即可。尚未决定的部分请明确标出来。
  - type: textarea
    id: compatibility
    attributes:
      label: 旧用法可能受到什么影响？（可选）
      description: 例如资源格式、自定义子类、调用方式或版本兼容。暂时不确定也可以说明。
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样确认调整有效？（可选）
      description: 写一个可以验证的例子或验收条件，后续讨论确定后再补齐。
