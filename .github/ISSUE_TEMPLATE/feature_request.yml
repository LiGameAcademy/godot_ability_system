name: 有个功能或易用性建议
description: 说说你在实际项目里遇到的限制，或者怎样用起来会更顺手。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        不需要先想好完整方案。一个具体的使用场景，通常比一长串接口更有帮助。
  - type: textarea
    id: problem
    attributes:
      label: 现在什么地方不方便？
      description: 你在做什么游戏或技能？现有用法带来了什么限制？
      placeholder: 做一个简单的瞬发技能，也需要先理解行为树节点和黑板，接入步骤有点多。
    validations:
      required: true
  - type: textarea
    id: desired_usage
    attributes:
      label: 你希望怎样使用？
      description: 描述希望完成的操作或结果即可，不必先设计 API。
      placeholder: 希望选好目标、费用和效果，就能配置一个普通瞬发技能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想到的办法（可选）
      description: 可以写用法、配置示例或其他插件里的参考，也可以留空一起讨论。
  - type: textarea
    id: alternatives
    attributes:
      label: 目前怎么绕过去的？（可选）
      description: 如果已经有临时做法，说说哪里仍不方便。
  - type: textarea
    id: context
    attributes:
      label: 项目背景或参考资料（可选）
      description: 例如 2D / 3D、单机 / 联机、Godot 版本，或相关 Issue。只写影响这个建议的信息即可。
