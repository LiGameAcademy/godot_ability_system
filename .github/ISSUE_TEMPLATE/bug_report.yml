name: 遇到 Bug 了
description: 告诉我们发生了什么，一起定位报错或不符合预期的行为。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先搜一下有没有相同的问题。标题可以直接写现象，例如“取消技能后，地面指示器还在”。
        不用先找到根因或解决办法；下面把你看到的情况说清楚就好。
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？
      description: 当时在做什么，哪里不符合预期？如果影响了游戏运行，也请说明。
      placeholder: 释放一个需要瞄准的技能，再按取消，指示器仍留在场景中。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 怎么遇到这个问题的？
      description: 写最少的操作步骤或脚本片段。如果暂时无法稳定复现，也可以说明出现条件。
      placeholder: |
        1. 给角色配置地面预览策略。
        2. 开始瞄准，再取消技能。
        3. 查看场景中的指示器是否已清理。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 你希望发生什么，实际又是什么？
      placeholder: |
        希望：取消后指示器消失，可以重新开始瞄准。
        实际：旧指示器留在场景中，再次瞄准时又出现一个。
    validations:
      required: true
  - type: input
    id: godot_version
    attributes:
      label: Godot 版本
      description: 在“帮助 → 关于”查看完整版本，并说明是否使用 .NET 版；本轮开发目标是 4.7.x。
      placeholder: 4.7 stable，.NET 版
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本或提交（可选）
      description: 填下载的 tag、commit 或下载日期即可；不知道时可以留空。
      placeholder: main 的某次提交 / 2026-10-07 下载
  - type: dropdown
    id: os
    attributes:
      label: 操作系统（可选）
      options:
        - Windows
        - macOS
        - Linux
        - 其他
  - type: textarea
    id: errors
    attributes:
      label: 报错、截图或日志（可选）
      description: 有的话附上第一条报错和相关堆栈。长日志可上传附件，公开前请移除私人信息。
  - type: textarea
    id: minimal
    attributes:
      label: 最小示例或相关代码（可选）
      description: 可以附小工程、场景或仓库链接。不需要上传整个游戏，也不要求先在干净工程中复现。
